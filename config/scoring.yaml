# Fit-Scoring. Alles hier ist bewusst als Klartext gehalten,
# damit du es ohne Python-Kenntnisse anpassen kannst.

# Dein Verfuegbarkeitsfenster
window:
  start: "2027-01-01"
  end: "2027-03-31"
  # Praktika, die frueher enden als das hier, sind zu kurz um sinnvoll zu sein
  min_months: 2

# Zielfunktionen. Je hoeher das Gewicht, desto relevanter.
# Treffer werden im Titel UND in der Beschreibung gesucht (Titel zaehlt doppelt).
functions:
  30:
    - brand management
    - brand manager
    - product marketing
    - category management
    - trade marketing
    - shopper marketing
    - brand marketing
  25:
    - buying
    - buyer
    - einkauf
    - merchandising
    - merchandise planning
    - e-commerce buying
  # Abgewertet nach dem ersten Lauf: "Business Development" hat einen
  # Fussballverein, zwei IT-Beratungen und mehrere Startups eingeschleppt.
  # Die Funktion bleibt drin, gewinnt aber nur noch mit Branchenbezug (siehe unten).
  12:
    - corporate strategy
    - business development
    - founders associate
    - commercial excellence
    - strategy intern
  10:
    - marketing
    - markenfuehrung
    - consumer

# Branchenbezug, gewichtet. Fashion und Luxury stehen bewusst hoeher als FMCG -
# der erste Lauf war stark FMCG-lastig, weil die Aggregatoren dort mehr Volumen
# haben. Diese Gewichtung zieht Mode wieder nach vorn, ohne FMCG auszuschliessen.
sector_signals:
  # Fashion / Luxury - Priorität
  22:
    - mode
    - fashion
    - luxury
    - luxus
    - maison
    - couture
    - ready-to-wear
    - apparel
    - textil
    - bekleidung
    - kollektion
    - collection
    - footwear
    - schuhe
    - accessoires
    - leather goods
    - lederwaren
    - schmuck
    - jewellery
    - jewelry
    - uhren
    - watches
    - visual merchandising
  # Beauty und Duefte - Bindeglied zwischen Luxury und FMCG
  16:
    - beauty
    - kosmetik
    - cosmetics
    - fragrance
    - parfum
    - skincare
  # FMCG und Handel allgemein
  11:
    - marke
    - brand
    - konsumgueter
    - consumer goods
    - fmcg
    - handel
    - retail
    - einzelhandel
    - lebensmittel
    - food
    - getraenke
    - sortiment
    - e-commerce
    - onlineshop

# Begriffe, die eine Stelle sofort disqualifizieren
exclude:
  - audit
  - wirtschaftspruefung
  - steuerberatung
  - software engineer
  - developer
  - data engineer
  - logistik
  - lagerist
  - verkaeufer
  - sales associate
  - retail store
  - ausbildung
  - werkstudent   # entferne diese Zeile, falls du auch Werkstudentenjobs sehen willst
  - abschlussarbeit
  - bachelorarbeit
  - masterarbeit

# Standorte. Reihenfolge = deine Praeferenz.
locations:
  25:
    - frankfurt
    - wien
    - vienna
  20:
    - muenchen
    - munich
    - hamburg
    - duesseldorf
    - dusseldorf
    - berlin
  15:
    - koeln
    - cologne
    - stuttgart
    - zurich
    - zuerich
    - herzogenaurach
    - metzingen
  10:
    - deutschland
    - germany
    - oesterreich
    - austria
    - schweiz
    - switzerland
  # Modemetropolen. Bewusst niedrig gewichtet - DACH bleibt Priorität.
  # Aber ohne diese Stufe würden LVMH, Richemont, OTB und Kering nie
  # auftauchen, weil ihre Zentralen dort sitzen. Zeile löschen, wenn du
  # nur im DACH-Raum suchen willst.
  8:
    - paris
    - milano
    - mailand
    - milan
    - london
    - amsterdam
    - genf
    - geneva
    - geneve

# Laufzeit-Bewertung. Erkannt wird "3 Monate", "6 months", "3-6 Monate" usw.
duration:
  ideal: [3, 4]       # volle Punkte
  ideal_points: 30
  acceptable: [5]     # verhandelbar, leichte Abwertung
  acceptable_points: 18
  # 6 Monate und mehr: abgewertet, aber nicht mehr auf null. Bei starken
  # Fashion-Häusern ist die Laufzeit oft Verhandlungssache, und eine
  # 6-Monats-Stelle bei LVMH ist mehr wert als eine passgenaue irgendwo.
  long_points: 12
  unknown_points: 8   # keine Angabe gefunden -> Zweifel zugunsten der Stelle

# Bonus, wenn ein Startdatum im Fenster erkannt wird
start_date_in_window_points: 25

# Ab diesem Score taucht eine Stelle im Dashboard auf.
#
# Nach dem ersten echten Lauf von 25 auf 45 angehoben. Messwerte daraus:
#   Ferrero Category Management Frankfurt ....... 78
#   Otto Einkauf Hamburg ........................ 73
#   Peek & Cloppenburg Brand Management ......... 73
#   FC Viktoria Berlin Business Development ..... 40   <- Rauschen
#   Devoteam IT-Beratung Business Development ... 40   <- Rauschen
# 45 trennt sauber. Tiefer setzen = mehr Rauschen, hoeher = du verpasst Randtreffer.
min_score: 45

# Wie viele Detailseiten pro Lauf nachgeladen werden, um Laufzeit und
# Startdatum zu ermitteln. Hoeher = genauer, aber laengere Laufzeit
# (etwa 1,5 Sekunden pro Seite).
enrich_limit: 40
