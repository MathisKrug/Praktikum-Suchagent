# Zielunternehmen.
#
# WICHTIG: Das Feld "adapter" ist bei den meisten Firmen eine VERMUTUNG,
# welches Bewerbersystem sie einsetzen. Ich konnte das nicht vorab testen.
# Fuehre einmal `python -m src.probe` aus - das Skript prueft jede Firma
# und sagt dir, welche funktionieren und welche nachgebessert werden muessen.
#
# status: unverified | ok | broken   (wird von probe.py aktualisiert)

companies:

  # ---------- FASHION / RETAIL ----------

  - key: zalando
    name: Zalando
    sector: fashion
    adapter: zalando
    status: unverified
    config:
      base: "https://jobs.zalando.com"

  - key: hugoboss
    name: HUGO BOSS
    sector: fashion
    adapter: successfactors
